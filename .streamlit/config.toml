# Os dois temas são declarados para o app continuar seguindo a preferência (claro/escuro) de quem acessa.
# Um bloco [theme] único fixaria o app em um só tema e os gráficos ficariam fora de sincronia.
[theme.light]
primaryColor = "#2a78d6"

[theme.dark]
primaryColor = "#3987e5"

[server]
headless = true

[browser]
gatherUsageStats = false
